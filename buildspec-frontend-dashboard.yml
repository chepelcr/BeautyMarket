version: 0.2

env:
  variables:
    ENVIRONMENT: "dev"
    REGION: "us-east-1"
    FRONTEND_DOMAIN: "j-markets.jcampos.dev"
    ROOT_DOMAIN: "jcampos.dev"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd fe/dashboard && npm ci && cd ../..

  pre_build:
    commands:
      - |
        SSM_PATH="/jcampos/${ENVIRONMENT}/jmarkets"
        cat > fe/dashboard/.env << EOF
        VITE_AWS_REGION=$(aws ssm get-parameter --name "${SSM_PATH}/aws/region" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_AWS_COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name "${SSM_PATH}/cognito/user-pool-id" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_AWS_COGNITO_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_PATH}/cognito/client-id" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_API_URL=$(aws ssm get-parameter --name "${SSM_PATH}/api/url" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_ORDERS_API_URL=$(aws ssm get-parameter --name "${SSM_PATH}/api/orders-url" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_AWS_S3_BUCKET_NAME=$(aws ssm get-parameter --name "${SSM_PATH}/s3/bucket" --query 'Parameter.Value' --output text --region ${REGION})
        VITE_BASE_DOMAIN=${FRONTEND_DOMAIN}
        VITE_APP_URL=https://admin.${FRONTEND_DOMAIN}
        VITE_HACIENDA_API_URL=https://api.hacienda.go.cr
        EOF
      - echo "fe/dashboard/.env written:"
      - cat fe/dashboard/.env

  build:
    commands:
      - echo "Building admin dashboard..."
      - npm run build:dashboard

  post_build:
    commands:
      - bash scripts/pipeline-frontend-dashboard.sh

artifacts:
  files:
    - "**/*"
  base-directory: dist/dashboard
  discard-paths: no
