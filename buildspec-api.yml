version: 0.2

env:
  variables:
    ENVIRONMENT: "dev"
    REGION: "us-east-1"
    API_DOMAIN: "markets-api.jcampos.dev"
    ROOT_DOMAIN: "jcampos.dev"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - pip3 install aws-sam-cli
      - npm ci

  build:
    commands:
      - bash scripts/pipeline-api.sh

  post_build:
    commands:
      - echo "API Gateway update phase complete"
