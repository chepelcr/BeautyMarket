services:
  dev:
    build: .
    ports:
      - "5000:5000"  # API Server
      - "3001:3001"  # Landing Client
      - "3002:3002"  # Dashboard
      - "9000:9000"  # Store Port
    volumes:
      - ./server:/app/server
      - ./landing-client:/app/landing-client
      - ./dashboard:/app/dashboard
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
    env_file:
      - .env
    environment:
      - NODE_ENV=development