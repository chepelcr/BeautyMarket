version: 0.2

env:
  variables:
    ENVIRONMENT: "dev"
    REGION: "us-east-1"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - yum install -y zip
      - npm ci

  build:
    commands:
      - bash scripts/pipeline-build.sh

  post_build:
    commands:
      - echo "Build phase complete"

artifacts:
  files:
    - lambda-package.zip
