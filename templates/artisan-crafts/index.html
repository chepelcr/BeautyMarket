<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artisan Crafts - Handmade Treasures & Artisanal Goods</title>
    <meta name="description" content="Discover unique handcrafted goods made by skilled artisans. Shop authentic pottery, textiles, jewelry, and more. Every piece tells a story." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts - Merriweather (body) + Josefin Sans (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <!-- SPA Routing Support -->
    <script>
      // Handle redirect from GitHub Pages 404.html for SPA routing
      // When a route is accessed directly, GitHub Pages serves 404.html
      // which redirects to index.html but stores the original path in sessionStorage
      (function() {
        const redirectPath = sessionStorage.getItem('redirect_path');
        if (redirectPath && redirectPath !== '/' && window.location.pathname !== redirectPath) {
          // Clear the redirect path from sessionStorage
          sessionStorage.removeItem('redirect_path');
          // Replace the current history entry to restore the original path
          window.history.replaceState(null, '', redirectPath);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
