AWSTemplateFormatVersion: "2010-09-09"
Description: JMarkets CI/CD pipeline — BuildLambda + UpdateFunction + UpdateApiGateway phases

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]
    Description: Deployment environment

  SourceOwnerParam:
    Type: String
    Default: chepelcr
    Description: GitHub owner (org or user)

  SourceRepoParam:
    Type: String
    Default: BeautyMarket
    Description: GitHub repository name

  SourceBranchParam:
    Type: String
    Default: develop
    Description: Branch to track

  BuildComputeTypeParam:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE

  ApiDomainParam:
    Type: String
    Default: markets-api.jcampos.dev
    Description: Custom API domain (passed to SAM deploy)

  RootDomainParam:
    Type: String
    Default: jcampos.dev
    Description: Root domain for Route53 hosted zone lookup

Resources:

  # ── Log Groups ───────────────────────────────────────────────────────────────

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-lambda-build"
      RetentionInDays: 14

  UpdateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-lambda-update"
      RetentionInDays: 14

  # ── Phase 1: Build Lambda zip ────────────────────────────────────────────────

  LambdaBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-lambda-build"
      Description: Build lambda-package.zip from source
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeTypeParam
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-build.yml
      TimeoutInMinutes: 20
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref BuildLogGroup
          Status: ENABLED

  # ── Phase 2: Update Lambda function code ─────────────────────────────────────

  UpdateFunctionProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-lambda-update"
      Description: Update Lambda function code from lambda-package.zip artifact
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-update.yml
      TimeoutInMinutes: 10
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref UpdateLogGroup
          Status: ENABLED

  # ── Phase 3: Update API Gateway via SAM ──────────────────────────────────────

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-api-gateway-update"
      RetentionInDays: 14

  ApiGatewayUpdateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-api-gateway-update"
      Description: Refresh swagger, regenerate SAM template, deploy API Gateway
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: API_DOMAIN
            Type: PLAINTEXT
            Value: !Ref ApiDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-api.yml
      TimeoutInMinutes: 20
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref ApiGatewayLogGroup
          Status: ENABLED

  # ── Pipeline ─────────────────────────────────────────────────────────────────

  JmarketsPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "jmarkets-${Environment}-pipeline"
      RoleArn:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codepipeline-role-arn"
      ArtifactStore:
        Type: S3
        Location:
          Fn::ImportValue: !Sub "jcampos-${Environment}-codepipeline-artifacts-bucket-name"
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn:
                  Fn::ImportValue: !Sub "jcampos-${Environment}-github-connection-arn"
                FullRepositoryId: !Sub "${SourceOwnerParam}/${SourceRepoParam}"
                BranchName: !Ref SourceBranchParam
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1

        - Name: BuildLambda
          Actions:
            - Name: BuildLambda
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref LambdaBuildProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        - Name: UpdateFunction
          Actions:
            - Name: UpdateFunction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref UpdateFunctionProject
                PrimarySource: SourceCode
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
                - Name: BuildOutput
              OutputArtifacts:
                - Name: UpdateOutput
              RunOrder: 1

        - Name: UpdateApiGateway
          Actions:
            - Name: UpdateApiGateway
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ApiGatewayUpdateProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"API_DOMAIN","value":"${ApiDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: ApiOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref JmarketsPipeline
    Export:
      Name: !Sub "${AWS::StackName}-PipelineName"

  BuildProjectName:
    Description: Build CodeBuild project
    Value: !Ref LambdaBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-BuildProjectName"

  UpdateProjectName:
    Description: Update CodeBuild project
    Value: !Ref UpdateFunctionProject
    Export:
      Name: !Sub "${AWS::StackName}-UpdateProjectName"
