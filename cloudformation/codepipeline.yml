AWSTemplateFormatVersion: "2010-09-09"
Description: JMarkets CI/CD pipeline — BuildLambda + UpdateFunction + UpdateApiGateway + DeployLanding + DeployDashboard + DeployTemplates

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]
    Description: Deployment environment

  SourceOwnerParam:
    Type: String
    Default: chepelcr
    Description: GitHub owner (org or user)

  SourceRepoParam:
    Type: String
    Default: BeautyMarket
    Description: GitHub repository name

  SourceBranchParam:
    Type: String
    Default: develop
    Description: Branch to track

  BuildComputeTypeParam:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE

  ApiDomainParam:
    Type: String
    Default: markets-api.jcampos.dev
    Description: Custom API domain (passed to SAM deploy)

  RootDomainParam:
    Type: String
    Default: jcampos.dev
    Description: Root domain for Route53 hosted zone lookup

  FrontendDomainParam:
    Type: String
    Default: j-markets.jcampos.dev
    Description: Base domain for all frontend apps (landing, dashboard, templates)

Resources:

  # ── Log Groups ───────────────────────────────────────────────────────────────

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-lambda-build"
      RetentionInDays: 14

  UpdateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-lambda-update"
      RetentionInDays: 14

  # ── Phase 1: Build Lambda zip ────────────────────────────────────────────────

  LambdaBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-lambda-build"
      Description: Build lambda-package.zip from source
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeTypeParam
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-build.yml
      TimeoutInMinutes: 20
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref BuildLogGroup
          Status: ENABLED

  # ── Phase 2: Update Lambda function code ─────────────────────────────────────

  UpdateFunctionProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-lambda-update"
      Description: Update Lambda function code from lambda-package.zip artifact
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-update.yml
      TimeoutInMinutes: 10
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref UpdateLogGroup
          Status: ENABLED

  # ── Phase 3: Update API Gateway via SAM ──────────────────────────────────────

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-api-gateway-update"
      RetentionInDays: 14

  ApiGatewayUpdateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-api-gateway-update"
      Description: Refresh swagger, regenerate SAM template, deploy API Gateway
      ServiceRole:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: API_DOMAIN
            Type: PLAINTEXT
            Value: !Ref ApiDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-api.yml
      TimeoutInMinutes: 20
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref ApiGatewayLogGroup
          Status: ENABLED

  # ── Phase 4: Deploy landing page ─────────────────────────────────────────────

  DeployLandingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-frontend-landing"
      RetentionInDays: 14

  DeployLandingProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-frontend-landing"
      Description: Build landing-client and deploy to S3+CloudFront via CFN stack
      ServiceRole:
        Fn::ImportValue: !Sub "jmarkets-fe-${Environment}-pipeline-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: FRONTEND_DOMAIN
            Type: PLAINTEXT
            Value: !Ref FrontendDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-landing.yml
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref DeployLandingLogGroup
          Status: ENABLED

  # ── Phase 5: Deploy admin dashboard ──────────────────────────────────────────

  DeployDashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-frontend-dashboard"
      RetentionInDays: 14

  DeployDashboardProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-frontend-dashboard"
      Description: Build admin dashboard and deploy to S3+CloudFront via CFN stack
      ServiceRole:
        Fn::ImportValue: !Sub "jmarkets-fe-${Environment}-pipeline-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: FRONTEND_DOMAIN
            Type: PLAINTEXT
            Value: !Ref FrontendDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-dashboard.yml
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref DeployDashboardLogGroup
          Status: ENABLED

  # ── Phase 6: Deploy pos-system POS app (independent) ────────────────────────

  DeployPosSystemLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-frontend-pos-system"
      RetentionInDays: 14

  DeployPosSystemProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-frontend-pos-system"
      Description: Build pos-system POS app and deploy to S3+CloudFront
      ServiceRole:
        Fn::ImportValue: !Sub "jmarkets-fe-${Environment}-pipeline-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: FRONTEND_DOMAIN
            Type: PLAINTEXT
            Value: !Ref FrontendDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-pos-system.yml
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref DeployPosSystemLogGroup
          Status: ENABLED

  # ── Phase 7: Deploy all 8 template storefronts ───────────────────────────────

  DeployTemplatesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jmarkets-${Environment}-frontend-templates"
      RetentionInDays: 14

  DeployTemplatesProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jmarkets-${Environment}-frontend-templates"
      Description: Build all 8 template storefronts and deploy to S3+CloudFront via CFN stacks
      ServiceRole:
        Fn::ImportValue: !Sub "jmarkets-fe-${Environment}-pipeline-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        # MEDIUM: building 8 Vite apps needs more RAM than the Lambda build
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: FRONTEND_DOMAIN
            Type: PLAINTEXT
            Value: !Ref FrontendDomainParam
          - Name: ROOT_DOMAIN
            Type: PLAINTEXT
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-templates.yml
      # Initial creation: 8 parallel CFN stacks (CloudFront + ACM) ≈ 20 min
      # + npm install + 8 Vite builds + 8 S3 syncs ≈ 20 min → 60 min is safe
      TimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref DeployTemplatesLogGroup
          Status: ENABLED

  # ── Pipeline ─────────────────────────────────────────────────────────────────

  JmarketsPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "jmarkets-${Environment}-pipeline"
      RoleArn:
        Fn::ImportValue: !Sub "jcampos-${Environment}-codepipeline-role-arn"
      ArtifactStore:
        Type: S3
        Location:
          Fn::ImportValue: !Sub "jcampos-${Environment}-codepipeline-artifacts-bucket-name"
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn:
                  Fn::ImportValue: !Sub "jcampos-${Environment}-github-connection-arn"
                FullRepositoryId: !Sub "${SourceOwnerParam}/${SourceRepoParam}"
                BranchName: !Ref SourceBranchParam
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1

        - Name: BuildLambda
          Actions:
            - Name: BuildLambda
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref LambdaBuildProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        - Name: UpdateFunction
          Actions:
            - Name: UpdateFunction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref UpdateFunctionProject
                PrimarySource: SourceCode
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
                - Name: BuildOutput
              OutputArtifacts:
                - Name: UpdateOutput
              RunOrder: 1

        - Name: UpdateApiGateway
          Actions:
            - Name: UpdateApiGateway
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ApiGatewayUpdateProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"API_DOMAIN","value":"${ApiDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: ApiOutput
              RunOrder: 1

        - Name: DeployLanding
          Actions:
            - Name: DeployLanding
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DeployLandingProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"FRONTEND_DOMAIN","value":"${FrontendDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: LandingOutput
              RunOrder: 1

        - Name: DeployDashboard
          Actions:
            - Name: DeployDashboard
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DeployDashboardProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"FRONTEND_DOMAIN","value":"${FrontendDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: DashboardOutput
              RunOrder: 1

        - Name: DeployPosSystem
          Actions:
            - Name: DeployPosSystem
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DeployPosSystemProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"FRONTEND_DOMAIN","value":"${FrontendDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: PosSystemOutput
              RunOrder: 1

        - Name: DeployTemplates
          Actions:
            - Name: DeployTemplates
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DeployTemplatesProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},
                   {"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},
                   {"name":"FRONTEND_DOMAIN","value":"${FrontendDomainParam}","type":"PLAINTEXT"},
                   {"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: TemplatesOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref JmarketsPipeline
    Export:
      Name: !Sub "${AWS::StackName}-PipelineName"

  BuildProjectName:
    Description: Build CodeBuild project
    Value: !Ref LambdaBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-BuildProjectName"

  UpdateProjectName:
    Description: Update CodeBuild project
    Value: !Ref UpdateFunctionProject
    Export:
      Name: !Sub "${AWS::StackName}-UpdateProjectName"
