AWSTemplateFormatVersion: '2010-09-09'
Description: JMarkets IAM Users and Policies for local development and Lambda execution

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

Resources:
  # Managed Policy for JMarkets Backend Operations
  JMarketsBackendPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'jmarkets-backend-policy-${Environment}'
      Description: Policy for JMarkets backend operations (Lambda and local development)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Cognito Permissions
          - Sid: CognitoUserManagement
            Effect: Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminUpdateUserAttributes
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminInitiateAuth
              - cognito-idp:AdminRespondToAuthChallenge
              - cognito-idp:ListUsers
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

          # S3 Full Access (matches current strawberry-be permissions)
          - Sid: S3FullAccess
            Effect: Allow
            Action:
              - s3:*
            Resource: '*'

          # CloudFront Full Access (matches current strawberry-be permissions)
          - Sid: CloudFrontFullAccess
            Effect: Allow
            Action:
              - cloudfront:*
            Resource: '*'

          # Route53 Permissions
          - Sid: Route53Operations
            Effect: Allow
            Action:
              - route53:CreateHostedZone
              - route53:GetHostedZone
              - route53:ListHostedZones
              - route53:ChangeResourceRecordSets
              - route53:GetChange
              - route53:ListResourceRecordSets
            Resource: '*'

          # ACM (Certificate Manager) Permissions
          - Sid: ACMOperations
            Effect: Allow
            Action:
              - acm:RequestCertificate
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:GetCertificate
              - acm:DeleteCertificate
              - acm:AddTagsToCertificate
            Resource: '*'

          # SES Full Access (matches current strawberry-be permissions)
          - Sid: SESFullAccess
            Effect: Allow
            Action:
              - ses:*
            Resource: '*'

          # Secrets Manager Permissions
          - Sid: SecretsManagerOperations
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:CreateSecret
              - secretsmanager:UpdateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecrets
            Resource: '*'

          # SNS/SQS Permissions
          - Sid: MessagingOperations
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sns:Publish
            Resource: '*'

  # IAM User for Local Development
  BackendDevUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'strawberry-be-${Environment}'
      ManagedPolicyArns:
        - !Ref JMarketsBackendPolicy
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: LocalDevelopment

  # Access Key for Local Development User
  BackendDevUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref BackendDevUser

Outputs:
  BackendPolicyArn:
    Description: ARN of the JMarkets Backend Policy
    Value: !Ref JMarketsBackendPolicy
    Export:
      Name: !Sub '${AWS::StackName}-BackendPolicyArn'

  BackendDevUserName:
    Description: IAM User for local development
    Value: !Ref BackendDevUser
    Export:
      Name: !Sub '${AWS::StackName}-DevUserName'

  BackendDevUserAccessKeyId:
    Description: Access Key ID for local development user
    Value: !Ref BackendDevUserAccessKey
    Export:
      Name: !Sub '${AWS::StackName}-DevUserAccessKeyId'

  BackendDevUserSecretAccessKey:
    Description: Secret Access Key for local development user (SENSITIVE - Store securely)
    Value: !GetAtt BackendDevUserAccessKey.SecretAccessKey
    Export:
      Name: !Sub '${AWS::StackName}-DevUserSecretKey'

  Note:
    Description: Important Security Note
    Value: 'IMPORTANT: The Secret Access Key is only displayed once. Store it securely in your .env file and never commit it to git.'
