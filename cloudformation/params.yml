AWSTemplateFormatVersion: '2010-09-09'
Description: >
  JMarkets Backend Services - SSM Parameters.
  Single resource per parameter; environment encoded in the path via !Sub.
  Path prefix: /jcampos/{env}/jmarkets  (matches server/settings.cfg ssmpath).
  DB credentials are NOT here — they live in Secrets Manager under
  jcampos/{env}/database, shared with other services.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  S3Bucket:
    Type: String
    Description: S3 bucket name for file uploads

  FromEmail:
    Type: String
    Description: SES verified sender address (e.g. noreply@j-markets.jcampos.dev)

  FrontendUrl:
    Type: String
    Description: Landing page / frontend URL (e.g. https://j-markets.jcampos.dev)

  DashboardUrl:
    Type: String
    Description: Dashboard / admin URL (e.g. https://admin.j-markets.jcampos.dev)

  CloudfrontDomain:
    Type: String
    Description: CloudFront distribution domain for cache invalidation and asset URLs

  ApiUrl:
    Type: String
    Description: Backend API URL (e.g. https://markets-api.jcampos.dev)

  OrdersApiUrl:
    Type: String
    Description: Orders service API URL (e.g. https://orders-api.jcampos.dev)

# ---------------------------------------------------------------------------
# Resources  — one SSM parameter per entry
# ---------------------------------------------------------------------------
Resources:

  # /jcampos/{env}/jmarkets/aws/stage
  AwsStage:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/aws/stage"
      Type: String
      Value: !Ref Environment
      Description: !Sub "Deployment stage for JMarkets Backend (${Environment})"

  # /jcampos/{env}/jmarkets/aws/region
  AwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/aws/region"
      Type: String
      Value: !Ref AWS::Region
      Description: AWS region

  # /jcampos/{env}/jmarkets/aws/database
  # Points to the shared Secrets Manager secret name (same secret used by other services)
  AwsDatabase:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/aws/database"
      Type: String
      Value: !Sub "jcampos/${Environment}/database"
      Description: Shared Secrets Manager secret name for database credentials

  # /jcampos/{env}/jmarkets/cognito/user-pool-id
  CognitoUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/cognito/user-pool-id"
      Type: String
      Value:
        Fn::ImportValue: "jmarkets-cognito-UserPoolId"
      Description: Cognito User Pool ID (imported from jmarkets-cognito stack)

  # /jcampos/{env}/jmarkets/cognito/client-id
  CognitoClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/cognito/client-id"
      Type: String
      Value:
        Fn::ImportValue: "jmarkets-cognito-UserPoolClientId"
      Description: Cognito User Pool Client ID (imported from jmarkets-cognito stack)

  # /jcampos/{env}/jmarkets/sns/organization-topic-arn
  SnsOrganizationTopicArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/sns/organization-topic-arn"
      Type: String
      Value:
        Fn::ImportValue: !Sub "jmarkets-${Environment}-organization-events-topic-arn"
      Description: SNS topic ARN for organization events (imported from organization-publish-topic stack)

  # /jcampos/{env}/jmarkets/s3/bucket
  S3BucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/s3/bucket"
      Type: String
      Value: !Ref S3Bucket
      Description: S3 bucket for file uploads

  # /jcampos/{env}/jmarkets/email/from
  EmailFromParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/email/from"
      Type: String
      Value: !Ref FromEmail
      Description: SES verified sender address

  # /jcampos/{env}/jmarkets/frontend/url
  FrontendUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/frontend/url"
      Type: String
      Value: !Ref FrontendUrl
      Description: Landing page / frontend URL

  # /jcampos/{env}/jmarkets/dashboard/url
  DashboardUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/dashboard/url"
      Type: String
      Value: !Ref DashboardUrl
      Description: Dashboard / admin URL

  # /jcampos/{env}/jmarkets/cloudfront/domain
  CloudfrontDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/cloudfront/domain"
      Type: String
      Value: !Ref CloudfrontDomain
      Description: CloudFront distribution domain for cache invalidation and asset URLs

  # /jcampos/{env}/jmarkets/api/url
  ApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/api/url"
      Type: String
      Value: !Ref ApiUrl
      Description: Backend API URL

  # /jcampos/{env}/jmarkets/api/orders-url
  OrdersApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/jcampos/${Environment}/jmarkets/api/orders-url"
      Type: String
      Value: !Ref OrdersApiUrl
      Description: Orders service API URL

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  SsmBasePath:
    Description: SSM base path for all JMarkets Backend parameters
    Value: !Sub "/jcampos/${Environment}/jmarkets"
    Export:
      Name: !Sub "jcampos-${Environment}-jmarkets-ssm-base-path"
